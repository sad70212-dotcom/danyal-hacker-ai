<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #000; color: #0f0; font-family: monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #terminal { flex: 1; overflow-y: auto; padding: 10px; }
        .input-area { display: flex; padding: 10px; background: #111; border-top: 1px solid #0f0; position: sticky; bottom: 0; }
        input { flex: 1; background: transparent; border: none; color: #0f0; outline: none; font-size: 16px; }
        button { background: #0f0; color: #000; border: none; padding: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="terminal">SYSTEM READY... DANYAL AI v7.0</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type here...">
        <button onclick="askAI()">RUN</button>
    </div>
    <script>
        const API_KEY = "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";
        async function askAI() {
            let input = document.getElementById('userInput');
            let term = document.getElementById('terminal');
            let text = input.value;
            if(!text) return;
            term.innerHTML += `<div style="color:#fff">> ${text}</div>`;
            input.value = "";
            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{role: "user", content: text}] })
                });
                const data = await res.json();
                term.innerHTML += `<div>AI: ${data.choices[0].message.content}</div>`;
            } catch (e) { term.innerHTML += "<div>Error!</div>"; }
        }
    </script>
</body>
</html>
