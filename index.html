<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DANYAL HACKER AI</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #terminal { flex: 1; overflow-y: auto; padding: 15px; background: #000; border-bottom: 2px solid #0f0; }
        .input-area { display: flex; padding: 10px; background: #111; }
        input { flex: 1; background: transparent; border: none; color: #0f0; font-size: 16px; outline: none; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; font-weight: bold; }
        .bot-msg { margin-bottom: 15px; border-left: 2px solid #0f0; padding-left: 8px; }
        .user-msg { color: #fff; margin-bottom: 15px; text-align: right; }
        .code-box { background: #222; color: #0ff; padding: 10px; display: block; overflow-x: auto; white-space: pre; border: 1px solid #444; margin-top: 5px; font-size: 12px; }
    </style>
</head>
<body>
    <div id="terminal"><div class="bot-msg">SYSTEM READY... DANYAL AI v6.2 ACTIVE.</div></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Enter command...">
        <button onclick="askAI()">RUN</button>
    </div>
    <script>
        const API_KEY = "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";
        async function askAI() {
            let input = document.getElementById('userInput');
            let term = document.getElementById('terminal');
            if(!input.value) return;
            let text = input.value;
            term.innerHTML += `<div class="user-msg">> ${text}</div>`;
            input.value = "";
            let resBox = document.createElement("div");
            resBox.className = "bot-msg";
            resBox.innerText = "Processing...";
            term.appendChild(resBox);
            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{role: "system", content: "You are a professional hacking assistant for Danyal. Only talk about hacking and code."}, {role: "user", content: text}]
                    })
                });
                const data = await res.json();
                let reply = data.choices[0].message.content;
                resBox.innerHTML = "AI: " + reply.replace(/```([\s\S]*?)```/g, '<code class="code-box">$1</code>').replace(/\n/g, '<br>');
            } catch (e) { resBox.innerText = "Error!"; }
            term.scrollTop = term.scrollHeight;
        }
    </script>
</body>
</html>
